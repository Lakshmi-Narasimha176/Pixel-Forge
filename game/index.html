<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE LAST REVENGE</title>
  <link rel="stylesheet" href="/src/ui/styles.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #c8c8c8;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      cursor: default;
      user-select: none;
    }

    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* ── Loading Screen ── */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      transition: opacity 1.2s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-screen h1 {
      font-size: 3rem;
      letter-spacing: 0.6rem;
      color: #8b0000;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(139, 0, 0, 0.6), 0 0 60px rgba(139, 0, 0, 0.3);
      margin-bottom: 2rem;
      animation: pulse 2s ease-in-out infinite;
    }

    #loading-bar-container {
      width: 320px;
      height: 4px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 2px;
      overflow: hidden;
    }

    #loading-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #8b0000, #cc0000);
      transition: width 0.3s ease;
    }

    #loading-text {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #555;
      letter-spacing: 0.15rem;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    /* ── Start Prompt ── */
    #start-prompt {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.92);
      cursor: pointer;
    }

    #start-prompt.visible {
      display: flex;
    }

    #start-prompt p {
      font-size: 1.2rem;
      color: #8b0000;
      letter-spacing: 0.3rem;
      animation: pulse 1.5s ease-in-out infinite;
    }

    #start-prompt .subtitle {
      margin-top: 0.5rem;
      font-size: 0.7rem;
      color: #444;
      letter-spacing: 0.2rem;
    }

    /* ── HUD ── */
    #hud {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 100;
      pointer-events: none;
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      width: 2px;
      height: 2px;
      background: rgba(200, 200, 200, 0.5);
      border-radius: 50%;
      box-shadow: 0 0 4px rgba(200, 200, 200, 0.3);
      pointer-events: none;
    }

    #interact-prompt {
      position: fixed;
      top: 55%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      font-size: 0.8rem;
      color: #aaa;
      letter-spacing: 0.15rem;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    #interact-prompt.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <h1>The Last Revenge</h1>
    <div id="loading-bar-container">
      <div id="loading-bar"></div>
    </div>
    <p id="loading-text">INITIALIZING...</p>
  </div>

  <!-- Start Prompt (after loading) -->
  <div id="start-prompt">
    <p>CLICK TO BEGIN</p>
    <span class="subtitle">— USE HEADPHONES FOR THE BEST EXPERIENCE —</span>
  </div>

  <!-- HUD -->
  <div id="hud"></div>
  <div id="crosshair"></div>
  <div id="interact-prompt">[E] Interact</div>

  <!-- Persistent Controls Helper Bar (always visible at bottom) -->
  <div id="persistent-controls" style="position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;font-size:0.72rem;color:#ccc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,monospace;background:rgba(10,8,8,0.92);padding:5px 18px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);pointer-events:none;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,0.85);backdrop-filter:blur(4px);z-index:9999;">
    <span><b style="background:#221a10;border:1px solid #e0a030;border-radius:3px;padding:1px 5px;color:#ffbb33;font-size:0.7rem;margin-right:2px;">WASD</b> Move</span>
    <span><b style="background:#221a10;border:1px solid #e0a030;border-radius:3px;padding:1px 5px;color:#ffbb33;font-size:0.7rem;margin-right:2px;">Mouse/Drag</b> Look</span>
    <span><b style="background:#1a1a24;border:1px solid #6688cc;border-radius:3px;padding:1px 5px;color:#88bbff;font-size:0.7rem;margin-right:2px;">Shift</b> Sprint</span>
    <span><b style="background:#1a1a24;border:1px solid #6688cc;border-radius:3px;padding:1px 5px;color:#88bbff;font-size:0.7rem;margin-right:2px;">C</b> Crouch</span>
    <span><b style="background:#281010;border:1px solid #ff4444;border-radius:3px;padding:1px 5px;color:#ff5555;font-size:0.7rem;margin-right:2px;">E</b> Interact</span>
    <span><b style="background:#242010;border:1px solid #ffd700;border-radius:3px;padding:1px 5px;color:#ffea55;font-size:0.7rem;margin-right:2px;">F</b> Flashlight</span>
    <span><b style="background:#2c0c0c;border:1px solid #ff2222;border-radius:3px;padding:1px 5px;color:#ff4444;font-size:0.7rem;margin-right:2px;">Q</b> Blood Bag (Heal)</span>
    <span><b style="background:#1a1a1a;border:1px solid #666;border-radius:3px;padding:1px 5px;color:#ccc;font-size:0.7rem;margin-right:2px;">1-8</b> Items</span>
    <span><b style="background:#1a1a1a;border:1px solid #555;border-radius:3px;padding:1px 5px;color:#aaa;font-size:0.7rem;margin-right:2px;">Esc</b> Pause</span>
  </div>

  <!-- Game Canvas is created by Three.js renderer -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
