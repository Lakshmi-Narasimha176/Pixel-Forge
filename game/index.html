<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE LAST REVENGE - Godot Official Web</title>
  <meta http-equiv="refresh" content="0; url=https://orvexgames-49f8a.web.app" />
  <script>window.location.replace("https://orvexgames-49f8a.web.app");</script>
  <link rel="stylesheet" href="/src/ui/styles.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #c8c8c8;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      cursor: default;
      user-select: none;
    }

    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* ── Loading Screen ── */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      transition: opacity 1.2s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-screen h1 {
      font-size: 3rem;
      letter-spacing: 0.6rem;
      color: #8b0000;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(139, 0, 0, 0.6), 0 0 60px rgba(139, 0, 0, 0.3);
      margin-bottom: 2rem;
      animation: pulse 2s ease-in-out infinite;
    }

    #loading-bar-container {
      width: 320px;
      height: 4px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 2px;
      overflow: hidden;
    }

    #loading-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #8b0000, #cc0000);
      transition: width 0.3s ease;
    }

    #loading-text {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #555;
      letter-spacing: 0.15rem;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    /* ── Start Prompt ── */
    #start-prompt {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.92);
      cursor: pointer;
    }

    #start-prompt.visible {
      display: flex;
    }

    #start-prompt p {
      font-size: 1.2rem;
      color: #8b0000;
      letter-spacing: 0.3rem;
      animation: pulse 1.5s ease-in-out infinite;
    }

    #start-prompt .subtitle {
      margin-top: 0.5rem;
      font-size: 0.7rem;
      color: #444;
      letter-spacing: 0.2rem;
    }

    /* ── HUD ── */
    #hud {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 100;
      pointer-events: none;
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      width: 2px;
      height: 2px;
      background: rgba(200, 200, 200, 0.5);
      border-radius: 50%;
      box-shadow: 0 0 4px rgba(200, 200, 200, 0.3);
      pointer-events: none;
    }

    #interact-prompt {
      position: fixed;
      top: 55%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      font-size: 0.8rem;
      color: #aaa;
      letter-spacing: 0.15rem;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    #interact-prompt.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <h1>The Last Revenge</h1>
    <div id="loading-bar-container">
      <div id="loading-bar"></div>
    </div>
    <p id="loading-text">INITIALIZING...</p>
  </div>

  <!-- Start Prompt (after loading) -->
  <div id="start-prompt">
    <p>CLICK TO BEGIN</p>
    <span class="subtitle">— USE HEADPHONES FOR THE BEST EXPERIENCE —</span>
  </div>

  <!-- HUD -->
  <div id="hud"></div>
  <div id="crosshair"></div>
  <div id="interact-prompt">[E] Interact</div>

  <!-- Game Canvas is created by Three.js renderer -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
